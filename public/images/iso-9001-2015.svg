<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08B"/>
      <stop offset="35%" stop-color="#D99B38"/>
      <stop offset="70%" stop-color="#9E6914"/>
      <stop offset="100%" stop-color="#5E3B05"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B87B1E"/>
      <stop offset="50%" stop-color="#FDE89D"/>
      <stop offset="100%" stop-color="#C28723"/>
    </linearGradient>

    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E2E"/>
      <stop offset="50%" stop-color="#0A111C"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F5E12"/>
      <stop offset="25%" stop-color="#D99B38"/>
      <stop offset="50%" stop-color="#FEE8A2"/>
      <stop offset="75%" stop-color="#D99B38"/>
      <stop offset="100%" stop-color="#8F5E12"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#D99B38" flood-opacity="0.4"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>

    <!-- Paths for curved text -->
    <!-- Top arc: radius 136, center 200, 200 -->
    <path id="topTextArc" d="M 52,200 A 148,148 0 0,1 348,200" fill="none"/>
    <!-- Bottom arc: radius 146, center 200, 200 -->
    <path id="bottomTextArc" d="M 350,200 A 150,150 0 0,1 50,200" fill="none"/>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Starburst/Rosette Base Ring -->
    <circle cx="200" cy="200" r="190" fill="url(#goldGrad)" stroke="#FFE89E" stroke-width="2"/>

    <!-- Outer Decorative Gear / Beads Pattern -->
    <circle cx="200" cy="200" r="182" fill="none" stroke="#5E3B05" stroke-width="1.5" stroke-dasharray="3, 4.5"/>

    <!-- Navy Outer Band Ring -->
    <circle cx="200" cy="200" r="176" fill="url(#navyGrad)" stroke="url(#goldLight)" stroke-width="4"/>

    <!-- Inner Golden Border for Text Area -->
    <circle cx="200" cy="200" r="126" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="200" cy="200" r="122" fill="none" stroke="#FFE79A" stroke-width="1" stroke-dasharray="2, 3"/>

    <!-- Curved Text: Top Arc (ISO 9001 : 2015) -->
    <text fill="#FFECA9" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="20.5" letter-spacing="4.5">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
        ★ ISO 9001:2015 ★
      </textPath>
    </text>

    <!-- Curved Text: Bottom Arc (QUALITY MANAGEMENT) -->
    <text fill="#FFECA9" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="15.5" letter-spacing="3.2">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
        CERTIFIED COMPANY
      </textPath>
    </text>

    <!-- Center Core Shield / Disc -->
    <circle cx="200" cy="200" r="114" fill="url(#navyGrad)" stroke="url(#goldLight)" stroke-width="3.5"/>
    <circle cx="200" cy="200" r="106" fill="#0C1523" opacity="0.95"/>

    <!-- Decorative Stars Behind Center -->
    <g fill="url(#goldLight)" transform="translate(0, -6)">
      <!-- 5 Quality Assurance Stars -->
      <path d="M 200,108 L 202.5,114.5 L 209,114.5 L 204,118.5 L 206,125 L 200,121 L 194,125 L 196,118.5 L 191,114.5 L 197.5,114.5 Z" />
      <path d="M 178,112 L 180,117.5 L 185.5,117.5 L 181,121 L 183,126.5 L 178,123 L 173,126.5 L 175,121 L 170.5,117.5 L 176,117.5 Z" transform="scale(0.85) translate(30, 20)" />
      <path d="M 222,112 L 224,117.5 L 229.5,117.5 L 225,121 L 227,126.5 L 222,123 L 217,126.5 L 219,121 L 214.5,117.5 L 220,117.5 Z" transform="scale(0.85) translate(38, 20)" />
    </g>

    <!-- Large Bold "ISO" Typography -->
    <text x="200" y="180" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="46" fill="url(#goldLight)" letter-spacing="2">
      ISO
    </text>

    <!-- Crisp "9001:2015" Badge -->
    <text x="200" y="210" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" letter-spacing="2">
      9001:2015
    </text>

    <!-- Gold Ribbon Bar for "CERTIFIED" -->
    <g transform="translate(0, 5)">
      <!-- Ribbon Shadow -->
      <path d="M 105,248 L 125,232 L 275,232 L 295,248 L 285,264 L 115,264 Z" fill="#000000" opacity="0.35"/>
      
      <!-- Main Ribbon Banner -->
      <polygon points="112,234 288,234 278,260 122,260" fill="url(#ribbonGrad)" stroke="#FFECA9" stroke-width="1.5"/>
      
      <!-- Ribbon Tails -->
      <polygon points="112,234 94,247 114,258 122,260 114,247" fill="#8F5E12"/>
      <polygon points="288,234 306,247 286,258 278,260 286,247" fill="#8F5E12"/>
      
      <!-- Text Inside Ribbon -->
      <text x="200" y="252" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#0F172A" letter-spacing="3.5">
        CERTIFIED
      </text>
    </g>

    <!-- Subtitle: Quality Management -->
    <text x="200" y="286" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" font-weight="700" font-size="9" fill="#94A3B8" letter-spacing="1.5">
      QUALITY MANAGEMENT SYSTEM
    </text>

    <!-- Security / Authenticity Tick / Checkmark Crest -->
    <circle cx="200" cy="308" r="11" fill="url(#goldGrad)" stroke="#FFECA9" stroke-width="1.5"/>
    <path d="M 195.5,308 L 198.5,311 L 205,304.5" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
